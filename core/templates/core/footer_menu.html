{% load wagtailcore_tags %}

{% if menu_items %}
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        {% for item in menu_items %}
            <div>
                <a href="{{ item.url }}" 
                   class="text-gray-600 hover:text-gray-900 text-sm transition-colors duration-200
                          {% if request.path == item.url %}text-gray-900 font-medium{% endif %}"
                   {% if item.is_external %}target="_blank" rel="noopener noreferrer"{% endif %}>
                    {{ item.title }}
                    {% if item.is_external %}
                        <svg class="inline w-3 h-3 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                        </svg>
                    {% endif %}
                </a>
            </div>
        {% endfor %}
    </div>
{% else %}
    <!-- Fallback footer links if no menu items -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div>
            <a href="/privacy/" class="text-gray-600 hover:text-gray-900 text-sm">Privacy Policy</a>
        </div>
        <div>
            <a href="/terms/" class="text-gray-600 hover:text-gray-900 text-sm">Terms of Service</a>
        </div>
        <div>
            <a href="/disclaimer/" class="text-gray-600 hover:text-gray-900 text-sm">Disclaimer</a>
        </div>
        <div>
            <a href="/contact/" class="text-gray-600 hover:text-gray-900 text-sm">Contact</a>
        </div>
    </div>
{% endif %}
