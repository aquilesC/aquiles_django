version: "3.9"

services:
  web:
    build:
      context: ..
      dockerfile: deploy/docker/app/Dockerfile
    env_file:
      - ./env/.env.base
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - aquiles
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aquiles}
      POSTGRES_USER: ${POSTGRES_USER:-aquiles}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aquiles}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aquiles

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
    networks:
      - aquiles

volumes:
  postgres_data:
  postgres_backups:
  static_volume:
  media_volume:

networks:
  aquiles:
    driver: bridge
