services:
  web:
    env_file:
      - ./env/.env.base
      - ./env/.env.prod
    restart: unless-stopped
    volumes:
      - ../.data/prod/static:/app/staticfiles
      - ../.data/prod/media:/app/media

  db:
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../.data/prod/backups:/backups
    restart: unless-stopped

  nginx:
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../.data/prod/static:/var/www/static:ro
      - ../.data/prod/media:/var/www/media:ro
